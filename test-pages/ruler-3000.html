<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ruler-3000</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .band {
        height: 100px;
        width: 100%;
        box-sizing: border-box;
        color: white;
        font: 14px monospace;
        padding-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="bands"></div>
    <script>
      // 30 bands x 100px = 3000px total page height. Each band's color is
      // a deterministic function of its index so shot-qa band-sample can
      // assert exact RGB per band — this is the golden test for the
      // scroll-and-stitch pipeline: any duplicated, skipped, or
      // misordered slice shows up as a wrong color at a specific band
      // index rather than a vague pixel-diff percentage.
      const BANDS = 30;
      const container = document.getElementById("bands");
      for (let i = 0; i < BANDS; i++) {
        const r = (i * 53) % 256;
        const g = (i * 97) % 256;
        const b = (i * 151) % 256;
        const div = document.createElement("div");
        div.className = "band";
        div.style.backgroundColor = `rgb(${r},${g},${b})`;
        div.textContent = `band ${i} rgb(${r},${g},${b})`;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
