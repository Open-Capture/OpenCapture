<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sticky-fixed</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: magenta;
        z-index: 10;
      }
      #badge {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 60px;
        height: 40px;
        background: cyan;
        z-index: 10;
      }
      #subheader {
        position: sticky;
        top: 50px;
        height: 30px;
        background: yellow;
      }
      .band {
        height: 100px;
        width: 100%;
        box-sizing: border-box;
      }
      #content {
        margin-top: 50px; /* clear the fixed header on first paint */
      }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <div id="content">
      <div id="subheader"></div>
      <div id="bands"></div>
    </div>
    <div id="badge"></div>
    <script>
      // 25 bands x 100px = 2500px of scrollable content, none of which use
      // magenta/cyan/yellow, so any pixel of those colors found far from
      // the page's true top/bottom edges after stitching proves the fixed
      // header/badge or sticky subheader leaked into a middle slice
      // instead of being hidden there.
      const BANDS = 25;
      const container = document.getElementById("bands");
      for (let i = 0; i < BANDS; i++) {
        const r = (i * 41) % 200;
        const g = (i * 83) % 200;
        const b = (i * 127) % 200;
        const div = document.createElement("div");
        div.className = "band";
        div.style.backgroundColor = `rgb(${r},${g},${b})`;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
