<!doctype html>
<html class="oa-auto">
  <head>
    <meta charset="utf-8" />
    <title>OpenCapture Account</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      #accountHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        background: var(--surface-card);
        border-bottom: var(--border-width) solid var(--border-hairline);
        flex: 0 0 auto;
      }
      #accountWrap {
        flex: 1 1 auto;
        overflow: auto;
        padding: var(--space-6) var(--space-4);
        background: var(--bg-page);
      }
      #accountStack {
        max-width: 420px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .oa-card {
        border: var(--border-width) solid var(--border-hairline);
        border-radius: var(--radius-lg);
        background: var(--surface-card);
        padding: var(--space-4);
      }
      .oa-card p {
        margin: 0 0 var(--space-2);
      }
      #stripePackages {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        margin-top: var(--space-2);
      }
      #stripePackages button {
        justify-content: space-between;
      }
      /* This account/credits layer is the one thing in OpenCapture
         that talks to a server — everything about a capture itself (the
         image, its pixels, its annotations) stays on-device regardless of
         whether the user ever opens this page. Said explicitly rather than
         left implicit, since staying silent here is what would make it
         look like a quiet reversal of the "100% local" claim in the popup. */
      #accountNote {
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="accountHeader">
      <img class="brand-wordmark brand-wordmark-light" src="../assets/logo/wordmark.svg" alt="OpenCapture" height="18" />
      <img class="brand-wordmark brand-wordmark-dark" src="../assets/logo/wordmark-dark.svg" alt="OpenCapture" height="18" />
      <button id="closeAccount" type="button" class="icon-btn" title="Close">
        <span class="oa-icon icon-x"></span>
      </button>
    </div>
    <div id="accountWrap">
      <div id="accountStack">
        <!-- Hand-rolled rather than <openapps-login>: that component's
             Google button redirects back to the current page, and Chrome
             refuses to land a cross-origin redirect on a chrome-extension://
             page (net::ERR_BLOCKED_BY_CLIENT, confirmed directly) — so
             instead this opens the sign-in flow in its own tab and gets the
             session relayed back via openapps-callback + background.ts,
             the same pattern the OpenApps Chrome extension reference
             example uses. See account.ts. -->
        <div id="signInCard" class="oa-card">
          <p>Sign in to OpenApps</p>
          <p class="oa-caption">One account for every app in the suite. Optional — OpenCapture works fully without it.</p>
          <button id="signInGoogle" class="btn btn-primary btn-full">Continue with Google</button>
        </div>
        <openapps-credits poll-seconds="30"></openapps-credits>
        <openapps-account></openapps-account>
        <!-- Same reasoning as the sign-in card: <openapps-buy>'s Stripe
             button redirects back to the current page by default, which
             Chrome blocks here. Lightning/Ethereum don't redirect at all
             (a QR/address/invoice shown in-page, paid externally), so
             those stay on the real component — only Stripe is hand-rolled. -->
        <div id="stripeBuyCard" class="oa-card">
          <p>Buy credits (card)</p>
          <div id="stripePackages"></div>
        </div>
        <openapps-buy rails="lightning,ethereum"></openapps-buy>
        <p id="accountNote">
          Your account and credit balance are handled by OpenApps. Captures, edits and exports never leave this device.
        </p>
      </div>
    </div>
    <script type="module" src="./account.ts"></script>
  </body>
</html>
